<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前后端分离计算器 · Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Calculator</h1>
      <span class="app-subtitle">前后端分离计算器</span>
      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-icon" type="button" title="切换主题" aria-label="切换主题">🌓</button>
      </div>
    </header>

    <main class="app-body">
      <!-- 计算器主面板 -->
      <section class="calculator card" aria-label="计算器">
        <div class="display">
          <div id="expression-display" class="display-expression" aria-live="polite"></div>
          <div id="result-display" class="display-result" aria-live="polite">0</div>
          <div id="error-display" class="display-error" role="alert"></div>
        </div>

        <div class="keypad">
          <button class="key key-fn" data-action="clear" type="button">C</button>
          <button class="key key-fn" data-action="backspace" type="button">⌫</button>
          <button class="key key-fn" data-action="paren" data-value="(" type="button">(</button>
          <button class="key key-fn" data-action="paren" data-value=")" type="button">)</button>

          <button class="key key-op" data-action="op" data-value="÷" type="button">÷</button>
          <button class="key" data-action="digit" data-value="7" type="button">7</button>
          <button class="key" data-action="digit" data-value="8" type="button">8</button>
          <button class="key" data-action="digit" data-value="9" type="button">9</button>

          <button class="key key-op" data-action="op" data-value="×" type="button">×</button>
          <button class="key" data-action="digit" data-value="4" type="button">4</button>
          <button class="key" data-action="digit" data-value="5" type="button">5</button>
          <button class="key" data-action="digit" data-value="6" type="button">6</button>

          <button class="key key-op" data-action="op" data-value="-" type="button">−</button>
          <button class="key" data-action="digit" data-value="1" type="button">1</button>
          <button class="key" data-action="digit" data-value="2" type="button">2</button>
          <button class="key" data-action="digit" data-value="3" type="button">3</button>

          <button class="key key-op" data-action="op" data-value="+" type="button">+</button>
          <button class="key key-neg" data-action="negate" type="button">+/−</button>
          <button class="key" data-action="digit" data-value="0" type="button">0</button>
          <button class="key" data-action="dot" type="button">.</button>

          <button class="key key-equals" data-action="equals" type="button">=</button>
        </div>
        <p class="hint">提示：支持键盘输入（数字 / 运算符 / Enter 计算 / Esc 清空 / ⌫ 退格）</p>
      </section>

      <!-- 历史记录面板 -->
      <section class="history card" aria-label="计算历史">
        <div class="history-header">
          <h2>计算历史</h2>
          <button id="clear-history" class="btn btn-danger btn-sm" type="button">清空全部</button>
        </div>
        <input id="history-search" class="history-search" type="search"
               placeholder="搜索历史（按表达式或结果）" aria-label="搜索历史">
        <div id="history-status" class="history-status"></div>
        <ul id="history-list" class="history-list"></ul>
        <div id="history-empty" class="history-empty">暂无计算历史，开始计算吧～</div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Front-End + Back-End Separation Calculator · EE308FZ Software Engineering Assignment 1</span>
    </footer>
  </div>

  <script src="js/calculator.js"></script>
</body>
</html>
